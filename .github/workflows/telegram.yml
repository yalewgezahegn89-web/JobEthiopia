name: Telegram Outbox

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-outbox-production
  cancel-in-progress: false

jobs:
  run-telegram-outbox:
    if: vars.ENABLE_PRODUCTION_SCHEDULED_WORKFLOWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke production Telegram outbox endpoint
        env:
          MAINTENANCE_TARGET_URL: "${{ vars.MAINTENANCE_TARGET_URL }}"
          MAINTENANCE_API_KEY: "${{ secrets.MAINTENANCE_API_KEY }}"
          INTERNAL_TELEGRAM_API_KEY: "${{ secrets.INTERNAL_TELEGRAM_API_KEY }}"
        run: |
          set -euo pipefail

          if [ -z "${MAINTENANCE_TARGET_URL}" ]; then
            echo "MAINTENANCE_TARGET_URL is not configured."
            exit 1
          fi

          # Route-dedicated secret when set, otherwise the shared maintenance
          # key. This lets operators adopt per-route keys without a
          # coordinated env change.
          TELEGRAM_KEY="${INTERNAL_TELEGRAM_API_KEY:-${MAINTENANCE_API_KEY}}"

          if [ -z "${TELEGRAM_KEY}" ]; then
            echo "No Telegram outbox key configured: set INTERNAL_TELEGRAM_API_KEY or MAINTENANCE_API_KEY."
            exit 1
          fi

          TELEGRAM_URL="${MAINTENANCE_TARGET_URL%/}/api/internal/telegram/publish"

          # A missing bot/channel configuration is reported as a 2xx
          # {"configured":false,...} body; non-2xx responses and network
          # failures fail the workflow loudly.
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            --max-time 120 \
            --retry 3 \
            --retry-delay 15 \
            --retry-on-http-error 429,500,502,503,504 \
            --header "x-maintenance-key: ${TELEGRAM_KEY}" \
            "${TELEGRAM_URL}" \
            | jq -e 'type == "object"' >/dev/null
