name: Maintenance

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-production
  cancel-in-progress: false

jobs:
  run-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke production maintenance endpoint
        env:
          MAINTENANCE_TARGET_URL: "${{ vars.MAINTENANCE_TARGET_URL }}"
          MAINTENANCE_API_KEY: "${{ secrets.MAINTENANCE_API_KEY }}"
        run: |
          set -euo pipefail

          if [ -z "${MAINTENANCE_TARGET_URL}" ]; then
            echo "MAINTENANCE_TARGET_URL is not configured."
            exit 1
          fi

          if [ -z "${MAINTENANCE_API_KEY}" ]; then
            echo "MAINTENANCE_API_KEY is not configured."
            exit 1
          fi

          MAINTENANCE_URL="${MAINTENANCE_TARGET_URL%/}/api/internal/maintenance/run"

          # --fail-with-body: any non-2xx (e.g. 401, 500, 502) exits non-zero
          # and the workflow fails. Network errors/empty responses fail via
          # set -o pipefail. jq rejects a malformed (non-object) 2xx body.
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            --max-time 300 \
            --retry 3 \
            --retry-delay 30 \
            --retry-on-http-error 429,500,502,503,504 \
            --header "x-maintenance-key: ${MAINTENANCE_API_KEY}" \
            "${MAINTENANCE_URL}" \
            | jq -e 'type == "object"' >/dev/null